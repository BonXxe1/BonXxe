name: Sync BPB Worker JS

on:
  schedule:
    # 每天 UTC 0 点（北京时间 08:00）自动检测并同步一次
    - cron: '0 0 * * *'
  # 允许在 GitHub 页面手动点击触发同步
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载原项目最新 Release 中的 worker.js
        run: |
          curl -L -o worker.js https://github.com/bia-pain-bache/BPB-Worker-Panel/releases/latest/download/worker.js

      - name: 检查改动并提交
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add worker.js
          if git diff --quiet && git diff --staged --quiet; then
            echo "没有新版本更新，无需提交。"
          else
            git commit -m "Auto sync worker.js from latest release"
            git push
          fi
