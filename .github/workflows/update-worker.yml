name: Auto Fetch worker.js

on:
  schedule:
    - cron: '0 3 * * *' # 每天凌晨 3 点自动检查更新
  workflow_dispatch: # 支持手动运行

jobs:
  fetch-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整历史以防冲突

      - name: Download worker.js
        run: |
          curl -sL https://raw.githubusercontent.com/bia-pain-bache/BPB-Worker-Panel/main/worker.js -o worker.js

      - name: Commit and Push if updated
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add worker.js
          if ! git diff --staged --quiet; then
            git commit -m "Auto update worker.js from upstream BPB-Worker-Panel"
            # 关键修改：在 push 前先把远程最新的代码变基拉取过来
            git pull origin main --rebase
            git push origin main
          else
            echo "No changes found in worker.js"
          fi
